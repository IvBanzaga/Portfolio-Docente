    <!-- Prevent theme & font-size flash on load -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
          var a11yRaw = localStorage.getItem('a11y-preferences');
          if (a11yRaw) {
            var prefs = JSON.parse(a11yRaw);
            if (prefs && typeof prefs.fontSizePercent === 'number') {
              document.documentElement.style.fontSize = prefs.fontSizePercent + '%';
            }
            if (prefs && prefs.pauseAnimations) {
              document.documentElement.classList.add('pausar-animaciones');
            }
          }
        } catch (e) {}
      })();
    </script>
